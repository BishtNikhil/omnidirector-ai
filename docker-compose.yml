services:
  omnidirector-studio:
    build: .
    container_name: omnidirector_studio
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OMNIDIRECTOR_PORT=8000
      - OMNIDIRECTOR_ENV=production
      - DIRECTOR_PRIMARY_PROVIDER=baseten
      - BASETEN_API_KEY=${BASETEN_API_KEY:-}
      - BASETEN_BASE_URL=https://inference.baseten.co/v1
      - BASETEN_MODEL_ID=meta-models/muse-spark-open-1026
      - META_MODEL_API_KEY=${META_MODEL_API_KEY:-}
      - META_MODEL_BASE_URL=https://api.meta.ai/v1
      - META_MODEL_NAME=muse-spark-1.1
      - ENABLE_LOCAL_SIMULATION_FALLBACK=true
    env_file:
      - .env
